apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate-job
  namespace: devops-team
spec:
  template:
    spec:
      containers:
      - name: prisma-migrator
        image: debjyoti08/crud-application-backend
        command: ["npx", "prisma", "migrate", "deploy"]
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: postgres-user
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: postgres-db
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-db:5432/$(POSTGRES_DB)"
      restartPolicy: OnFailure
  backoffLimit: 4